# SPDX-License-Identifier: AGPL-3.0-only
# bump scope (Dockwell's ADR 0100): whether a pull request is one the catalog could
# take without a person. It runs from main's own definition, reads the diff alone,
# and never checks out or runs the head: the head's commit is fetched as objects, and
# Dockwell's dockwell-catalog, at the commit main's .github/dockwell-commit names,
# reads them. Its result is a commit status on the head, "bump scope", which a
# ruleset can require. It judges the commit, not the pull request that started the
# run: a commit that is the App's head anywhere is judged as the App's bump
# (bump scope-whose). A person's pull request passes, as the review rule decides
# it. One from the bump App passes only where it's the step the bump makes now with
# nothing waiting for a person, or a maintainer approved its head: their review runs
# this again (review.yml).
name: Bump scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_run:
    workflows: [Review]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

# Keyed by the pull request's number, from either trigger, never a branch a fork
# names; and queued, not cancelled, so an approval's run and a push's both post, in
# order (#726's slice 2 review, L4).
concurrency:
  group: scope-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

env:
  BUMP_APP: app/dockwell-catalog-bump

jobs:
  scope:
    name: Bump scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Which pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [[ ! "$NUMBER" =~ ^[0-9]+$ ]]; then
            echo "No pull request of this repository to read."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" > "$RUNNER_TEMP/started.json"
          head=$(jq -r .head.sha "$RUNNER_TEMP/started.json")
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::pull request $NUMBER has no head commit"; exit 1; }
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          # Every pull request with this commit as its head, and this repository's
          # bump branches: a commit status shows on each, so the commit is judged.
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$head/pulls" | jq -s 'add // []' > "$RUNNER_TEMP/open.json"
          git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 'refs/heads/bump/*' > "$RUNNER_TEMP/branches.txt"
      - name: Pending
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=pending -f context="bump scope" \
            -f description="Reading the diff" > /dev/null
      # main's own files: the head is never checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.number != ''
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: catalog
          fetch-depth: 0
          persist-credentials: false
      - name: The head's commit, as objects alone
        if: steps.pr.outputs.number != ''
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          git -C catalog fetch -q --no-tags origin "refs/pull/$NUMBER/head"
          git -C catalog cat-file -e "$HEAD^{commit}"
      - name: Which commit of Dockwell reads it
        if: steps.pr.outputs.number != ''
        id: dockwell
        run: |
          commit=$(tr -d '[:space:]' < catalog/.github/dockwell-commit)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::main's .github/dockwell-commit names no commit"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.number != ''
        with:
          repository: Dockwell/dockwell
          ref: ${{ steps.dockwell.outputs.commit }}
          path: dockwell
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pr.outputs.number != ''
        with:
          go-version-file: dockwell/go.mod
          cache-dependency-path: dockwell/go.sum
      - name: What the commit is judged as
        if: steps.pr.outputs.number != ''
        id: whose
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          (cd dockwell && go run ./cmd/dockwell-catalog bump scope-whose --head "$HEAD" --app "$BUMP_APP" \
            --started "$RUNNER_TEMP/started.json" --open "$RUNNER_TEMP/open.json" --branches "$RUNNER_TEMP/branches.txt") > "$RUNNER_TEMP/whose.json"
          jq -r '"number=\(.number)", "branch=\(.branch)", "author=\(.author)", "cross=\(.cross_repository)"' "$RUNNER_TEMP/whose.json" >> "$GITHUB_OUTPUT"
          # Its base and body are those of the pull request it's judged as.
          number=$(jq -r .number "$RUNNER_TEMP/whose.json")
          if [[ "$number" != 0 ]]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$number" > "$RUNNER_TEMP/pr.json"
          else
            jq '.body = ""' "$RUNNER_TEMP/started.json" > "$RUNNER_TEMP/pr.json"
          fi
          echo "base=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/body.md"
      - name: Whether a maintainer approved its head
        if: steps.pr.outputs.number != ''
        id: approved
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.whose.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          approved=false
          # A bump branch with no pull request open has no approvals to read.
          if [[ "$NUMBER" == 0 ]]; then
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Each reviewer's latest review that approves or asks for changes, at the head.
          while read -r reviewer; do
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$reviewer/permission" --jq .permission)
            if [[ "$permission" == admin || "$permission" == maintain || "$permission" == write ]]; then
              approved=true
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/reviews" |
            jq -rs --arg head "$HEAD" 'add // [] | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))
              | group_by(.user.login) | map(max_by(.submitted_at)) | map(select(.state == "APPROVED" and .commit_id == $head)) | .[].user.login')
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
      - name: Bump scope
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Read-only, for GitHub's rate as it reads the app's releases again.
          GITHUB_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
          BASE_SHA: ${{ steps.whose.outputs.base }}
          BRANCH: ${{ steps.whose.outputs.branch }}
          AUTHOR: ${{ steps.whose.outputs.author }}
          CROSS: ${{ steps.whose.outputs.cross }}
          APPROVED: ${{ steps.approved.outputs.approved }}
        run: |
          flags=(--catalog "$GITHUB_WORKSPACE/catalog" --base "$BASE_SHA" --head "$HEAD" --author "$AUTHOR" --app "$BUMP_APP"
            --branch "$BRANCH" --body "$RUNNER_TEMP/body.md")
          [[ "$CROSS" != true ]] || flags+=(--cross-repository)
          [[ "$APPROVED" != true ]] || flags+=(--approved)
          if ! (cd dockwell && go run ./cmd/dockwell-catalog bump scope "${flags[@]}") > "$RUNNER_TEMP/scope.json"; then
            jq -n '{state: "error", description: "bump scope couldn'"'"'t read it. Run it again"}' > "$RUNNER_TEMP/scope.json"
          fi
          jq -r '.why[]? | "- " + .' "$RUNNER_TEMP/scope.json" >> "$GITHUB_STEP_SUMMARY"
          state=$(jq -r .state "$RUNNER_TEMP/scope.json")
          description=$(jq -r .description "$RUNNER_TEMP/scope.json")
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state="$state" -f context="bump scope" \
            -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "bump scope: $state, $description"
