# SPDX-License-Identifier: AGPL-3.0-only
id: gitea
name: Gitea
summary: Git hosting with code review
description: |-
  Gitea hosts Git repositories with the collaboration tools around them. Keep source code on your server, track issues, and review changes through pull requests in a browser.

  This install gives you a Gitea server, persistent storage, and an owner account Dockwell makes as it installs. Sign in, then create or import your repositories.
icon: media/gitea-icon.webp
documentation: https://docs.gitea.com
appSource: https://github.com/go-gitea/gitea
features:
  - "Git repositories on your server"
  - "Pull requests and code review"
  - "Issue tracking and project collaboration"
  - "Repository permissions and webhooks"
screenshots:
  - path: media/gitea-repository.webp
    caption: "Browse a Git repository in Gitea"
    source: https://about.gitea.com/img/home-screenshot.png
  - path: media/gitea-review.webp
    caption: "Collaborate on code in Gitea"
    source: https://about.gitea.com/img/home-screenshot-2.png
category: developer tools
version: "28.4.0"
release: 7
homepage: https://about.gitea.com
license: AGPL-3.0-only
appLicense: MIT
source:
  repository: https://github.com/Dockwell/catalog
  path: entries/gitea.yaml
web:
  service: gitea
owner:
  service: gitea
  emailInput: OWNER_EMAIL
  userInput: OWNER_USER
  passwordInput: OWNER_PASSWORD
  userPattern: "^[a-zA-Z0-9_.-]+$"
  # Gitea makes up a password no one keeps, and a token the next step captures sets
  # the owner's own over its API, so no process's arguments hold it. A second try
  # after one that stopped part-way skips a user Gitea already has.
  steps:
    - command:
        user: git
        words:
          - sh
          - -c
          - gitea admin user create --admin --username "$OWNER_USER" --email "$OWNER_EMAIL" --random-password --must-change-password=false
      unless:
        request:
          path: /api/v1/users/${OWNER_USER}
          port: 3000
    - command:
        user: git
        words:
          - sh
          - -c
          - n="dockwell-$(date +%s%N)"; echo "name=$n"; gitea admin user generate-access-token --username "$OWNER_USER" --token-name "$n" --scopes write:admin --raw
        capture:
          TOKEN: '(?m)^([0-9a-f]{40})\s*$'
          TOKEN_NAME: 'name=(\S+)'
    - request:
        method: PATCH
        path: /api/v1/admin/users/${OWNER_USER}
        contentType: application/json
        body: '{"password":"${OWNER_PASSWORD}","login_name":"${OWNER_USER}","source_id":0,"must_change_password":false}'
        headers:
          Authorization: token ${TOKEN}
        port: 3000
    - request:
        method: DELETE
        path: /api/v1/users/${OWNER_USER}/tokens/${TOKEN_NAME}
        headers:
          Authorization: Basic ${DOCKWELL_OWNER_BASIC}
        port: 3000
  # A new password, as the steps after the user set it: a token Gitea makes sets
  # it over the API, then goes, deleted signing in with the new one.
  resetSteps:
    - command:
        user: git
        words:
          - sh
          - -c
          - n="dockwell-$(date +%s%N)"; echo "name=$n"; gitea admin user generate-access-token --username "$OWNER_USER" --token-name "$n" --scopes write:admin --raw
        capture:
          TOKEN: '(?m)^([0-9a-f]{40})\s*$'
          TOKEN_NAME: 'name=(\S+)'
    - request:
        method: PATCH
        path: /api/v1/admin/users/${OWNER_USER}
        contentType: application/json
        body: '{"password":"${OWNER_PASSWORD}","login_name":"${OWNER_USER}","source_id":0,"must_change_password":false}'
        headers:
          Authorization: token ${TOKEN}
        port: 3000
    - request:
        method: DELETE
        path: /api/v1/users/${OWNER_USER}/tokens/${TOKEN_NAME}
        headers:
          Authorization: Basic ${DOCKWELL_OWNER_BASIC}
        port: 3000
  done:
    request:
      path: /api/v1/user
      headers:
        Authorization: Basic ${DOCKWELL_OWNER_BASIC}
      port: 3000
signups:
  service: gitea
  variable: GITEA__service__DISABLE_REGISTRATION
  closed: "true"
addressVariables:
  - service: gitea
    variable: GITEA__server__ROOT_URL
    value: "https://{domain}/"
notes:
  - "Git over SSH answers on its SSH port, on this server alone."
inputs:
  - name: PORT
    label: Port on this server
    type: INPUT_TYPE_PORT
    defaultValue: "3000"
  - name: SSH_PORT
    label: SSH port
    hint: "Git over SSH, beside the server's own on 22."
    type: INPUT_TYPE_PORT
    defaultValue: "2222"
  - name: SECRET_KEY
    setOnce: true
    label: Secret key
    type: INPUT_TYPE_SECRET
    generate: 64
  - name: OWNER_EMAIL
    label: Owner's email
    type: INPUT_TYPE_EMAIL
  - name: OWNER_USER
    label: Owner's user name
    type: INPUT_TYPE_TEXT
  - name: OWNER_PASSWORD
    label: Owner's password
    type: INPUT_TYPE_SECRET
    generate: 24
    generateAs: GENERATE_AS_PASSWORD
compose: |
  services:
    gitea:
      image: gitea/gitea:28.4.0@sha256:aa90e8f00b755b0d665214ab9c14447ea44d3190dbe6b6d0cb46cd9c4f55d309
      restart: unless-stopped
      environment:
        GITEA__database__DB_TYPE: sqlite3
        GITEA__security__INSTALL_LOCK: "true"
        GITEA__server__SSH_PORT: ${SSH_PORT}
        # Without one, Gitea encrypts with a key everyone knows, and can't change it later.
        GITEA__security__SECRET_KEY: ${SECRET_KEY}
      ports:
        - "127.0.0.1:${PORT}:3000"
        - "127.0.0.1:${SSH_PORT}:22"
      volumes:
        - data:/data
      healthcheck:
        test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:3000/api/healthz"]
        interval: 10s
        timeout: 5s
        retries: 18
        start_period: 20s
  volumes:
    data: {}
