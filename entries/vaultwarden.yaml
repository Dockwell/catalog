# SPDX-License-Identifier: AGPL-3.0-only
id: vaultwarden
name: Vaultwarden
summary: Passwords, Bitwarden-compatible
description: |-
  Vaultwarden is a lightweight, community-maintained password vault server compatible with Bitwarden clients. Keep your vault on your own server and connect it from a browser, desktop app or mobile client.

  This entry includes the web vault and persistent storage. Serve it over HTTPS before using browser features. Vaultwarden is an independent project; it is not the official Bitwarden server.
icon: media/vaultwarden-icon.webp
documentation: https://github.com/dani-garcia/vaultwarden/wiki
appSource: https://github.com/dani-garcia/vaultwarden
features:
  - "Bitwarden-compatible clients"
  - "Included web vault"
  - "Password and secure-note storage"
  - "Vault data on your own server"
screenshots:
  - path: media/vaultwarden-client.webp
    caption: "Bitwarden browser extension, a separate client compatible with Vaultwarden"
    source: https://raw.githubusercontent.com/bitwarden/clients/103de051270fb7156dbfdbb95ac2ab66722db267/apps/browser/store/locales/en/screenshots/Chrome/Chrome01.png
category: security
version: "1.37.5"
release: 5
homepage: https://github.com/dani-garcia/vaultwarden
license: AGPL-3.0-only
appLicense: AGPL-3.0-only
source:
  repository: https://github.com/Dockwell/catalog
  path: entries/vaultwarden.yaml
web:
  service: vaultwarden
# Its owner's account comes from their master password, in their browser, so
# Dockwell invites their email through the admin API, with a token it generates and
# keeps sealed, and the install is held until they've registered through its setup
# link. Then ADMIN_TOKEN goes, which turns the admin page off.
owner:
  service: vaultwarden
  emailInput: OWNER_EMAIL
  madeWhenDone: true
  unsetWhenMade: [ADMIN_TOKEN]
  steps:
    - request:
        method: POST
        path: /admin
        contentType: application/x-www-form-urlencoded
        body: token=${ADMIN_TOKEN_PLAIN}
        capture:
          VW_SESSION: cookie:VW_ADMIN
        port: 80
    - request:
        method: POST
        path: /admin/invite
        contentType: application/json
        body: '{"email":"${OWNER_EMAIL}"}'
        headers:
          Cookie: VW_ADMIN=${VW_SESSION}
        port: 80
      unless:
        before:
          method: POST
          path: /admin
          contentType: application/x-www-form-urlencoded
          body: token=${ADMIN_TOKEN_PLAIN}
          capture:
            VW_SESSION: cookie:VW_ADMIN
          port: 80
        request:
          path: /admin/users
          headers:
            Cookie: VW_ADMIN=${VW_SESSION}
          port: 80
        where: "[email=${OWNER_EMAIL}].object=user"
  # Made once the invited user has registered: _status 0, where 1 is invited.
  done:
    before:
      method: POST
      path: /admin
      contentType: application/x-www-form-urlencoded
      body: token=${ADMIN_TOKEN_PLAIN}
      capture:
        VW_SESSION: cookie:VW_ADMIN
      port: 80
    request:
      path: /admin/users
      headers:
        Cookie: VW_ADMIN=${VW_SESSION}
      port: 80
    where: "[email=${OWNER_EMAIL}]._status=0"
signups:
  service: vaultwarden
  variable: SIGNUPS_ALLOWED
  closed: "false"
addressVariables:
  - service: vaultwarden
    variable: DOMAIN
    value: "https://{domain}"
notes:
  - "Its web vault signs in only over HTTPS, or on localhost."
  - "Bitwarden's apps sign in at the same address."
inputs:
  - name: PORT
    label: Port on this server
    type: INPUT_TYPE_PORT
    defaultValue: "8222"
  - name: OWNER_EMAIL
    label: Owner's email
    type: INPUT_TYPE_EMAIL
  - name: ADMIN_TOKEN_PLAIN
    label: Admin token
    type: INPUT_TYPE_SECRET
    generate: 48
  - name: ADMIN_TOKEN
    label: Admin token's hash
    type: INPUT_TYPE_SECRET
    hashOf: ADMIN_TOKEN_PLAIN
compose: |
  services:
    vaultwarden:
      image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
      restart: unless-stopped
      environment:
        ADMIN_TOKEN: ${ADMIN_TOKEN}
        # Dockwell signs in to the admin page to invite the owner and to read
        # they've registered, more often than its default allows.
        ADMIN_RATELIMIT_SECONDS: "60"
        ADMIN_RATELIMIT_MAX_BURST: "30"
      ports:
        - "127.0.0.1:${PORT}:80"
      volumes:
        - data:/data
      healthcheck:
        test: ["CMD", "/healthcheck.sh"]
        interval: 10s
        timeout: 5s
        retries: 12
        start_period: 10s
  volumes:
    data: {}
